name: build-apk

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0)'
        required: true
        default: 'v1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install platform and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResolverKiller-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ResolverKiller ${{ inputs.version }}
          body: |
            ResolverKiller — 极米固件上只写 wide 时，自动关闭桌面选择框并拉回 Aerial 的无障碍服务。

            适用：极米设备 + Aerial 桌面。不读 UI 树、不写首选记录、不影响 Aerial 自带的守护服务。

            安装：
            ```
            adb install -r app-debug.apk
            adb shell settings put secure enabled_accessibility_services "com.xgimi.duertts/com.xgimi.duertts.MonitorService:app.orchard.tv/app.orchard.tv.guard.HomeGuardService:com.sln162.resolverkiller/com.sln162.resolverkiller.ResolverKillerService"
            ```
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

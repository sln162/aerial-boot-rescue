name: build-apk
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'APK 文件名版本号'
        required: true
        default: 'v2.2'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch rescue check
        run: |
          set -e
          sed -i '/if (hasAnyWindow()) {/,+5d' app/src/main/java/com/sln162/bootrescue/BootA11yService.java
          sed -i 's/versionCode 18/versionCode 19/; s/versionName "1.3.2"/versionName "1.3.3"/' app/build.gradle
          sed -i 's/极米防黑屏 1.3.2/极米防黑屏 1.3.3/' app/src/main/java/com/sln162/bootrescue/MainActivity.java
          echo "--- hasAnyWindow call left:"
          grep -n 'hasAnyWindow() {' app/src/main/java/com/sln162/bootrescue/BootA11yService.java || true
          echo "--- version:"
          grep -n 'versionCode\|versionName' app/build.gradle
      - name: Install platform and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk BootRescue-${{ inputs.version }}.apk
          ls -l
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BootRescue-${{ inputs.version }}
          path: app/build/outputs/apk/debug/BootRescue-*.apk

name: build-apk
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'APK 文件名版本号'
        required: true
        default: 'v2.2'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install platform and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk AerialHome-${{ inputs.version }}.apk
          ls -l
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AerialHome-${{ inputs.version }}
          path: app/build/outputs/apk/debug/AerialHome-*.apk

name: build-apk

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: 'v2.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reset project sources
        run: |
          rm -rf app/src/main/java app/src/main/res
          mkdir -p app/src/main/java/com/sln162/bootrescue
          mkdir -p app/src/main/res/xml

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sln162.bootrescue'
              compileSdk 28

              defaultConfig {
                  applicationId "com.sln162.bootrescue"
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName "2.1"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="false"
                  android:label="BootRescue">

                  <service
                      android:name=".BootA11yService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:directBootAware="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/a11y_config" />
                  </service>

                  <receiver
                      android:name=".BootGuardReceiver"
                      android:directBootAware="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:excludeFromRecents="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/res/xml/a11y_config.xml <<'XML2'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true" />
          XML2

          cat > app/src/main/java/com/sln162/bootrescue/BootA11yService.java <<'JAVA'
          package com.sln162.bootrescue;

          import android.accessibilityservice.AccessibilityService;
          import android.content.ComponentName;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.Intent;
          import android.database.ContentObserver;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class BootA11yService extends AccessibilityService {
              private static final String AERIAL_PKG = "app.orchard.tv";
              private static final String AERIAL_CLS = "app.orchard.tv.MainActivity";
              private static final long WINDOW_MS = 180000L;
              private static final long CHECK_MS = 2000L;
              private static final long ENSURE_DEBOUNCE_MS = 30000L;

              private Handler handler;
              private long startedAt;
              private int attempts;
              private long lastEnsure;
              private ContentObserver observer;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  handler = new Handler(Looper.getMainLooper());
                  startedAt = SystemClock.elapsedRealtime();
                  attempts = 0;
                  log("bound, uptime=" + startedAt + "ms");
                  ensureSelf(this, true);
                  watchSettings();
                  handler.postDelayed(tick, CHECK_MS);
              }

              private void watchSettings() {
                  try {
                      ContentResolver cr = getContentResolver();
                      observer = new ContentObserver(handler) {
                          @Override
                          public void onChange(boolean selfChange) {
                              log("a11y list changed");
                              ensureSelf(BootA11yService.this, false);
                          }
                      };
                      cr.registerContentObserver(
                              Settings.Secure.getUriFor(Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES),
                              false, observer);
                  } catch (Throwable t) {
                      log("watch failed: " + t);
                  }
              }

              private static long LAST_ENSURE = 0L;

              static void ensureSelf(Context context, boolean force) {
                  long now = SystemClock.elapsedRealtime();
                  if (!force && LAST_ENSURE != 0L && now - LAST_ENSURE < ENSURE_DEBOUNCE_MS) {
                      return;
                  }
                  LAST_ENSURE = now;
                  try {
                      ComponentName me = new ComponentName(context.getPackageName(),
                              BootA11yService.class.getName());
                      String flat = me.flattenToString();
                      String cur = readList(context);
                      if (cur != null && cur.contains(flat)) {
                          return;
                      }
                      String next = (cur == null || cur.isEmpty()) ? flat : cur + ":" + flat;
                      if (!writeList(context, next)) {
                          writeList(context.createDeviceProtectedStorageContext(), next);
                      }
                      try {
                          Settings.Secure.putInt(context.getContentResolver(),
                                  Settings.Secure.ACCESSIBILITY_ENABLED, 1);
                      } catch (Throwable ignored) {
                      }
                      logLine(context, "restored self into a11y list");
                  } catch (Throwable t) {
                      logLine(context, "ensureSelf failed: " + t);
                  }
              }

              static String readList(Context context) {
                  try {
                      String v = Settings.Secure.getString(context.getContentResolver(),
                              Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      if (v != null) {
                          return v;
                      }
                  } catch (Throwable ignored) {
                  }
                  try {
                      String v = Settings.Secure.getString(
                              context.createDeviceProtectedStorageContext().getContentResolver(),
                              Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      if (v != null) {
                          return v;
                      }
                  } catch (Throwable ignored) {
                  }
                  return null;
              }

              static boolean writeList(Context context, String value) {
                  try {
                      Settings.Secure.putString(context.getContentResolver(),
                              Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, value);
                      return true;
                  } catch (Throwable t) {
                      logLine(context, "write failed: " + t);
                      return false;
                  }
              }

              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      long now = SystemClock.elapsedRealtime();
                      if (now - startedAt > WINDOW_MS) {
                          log("window closed after " + attempts + " checks");
                          return;
                      }
                      attempts++;
                      String front = frontPackage();
                      if (front != null && AERIAL_PKG.equals(front)) {
                          log("aerial in front, done");
                          return;
                      }
                      if (front != null) {
                          log("front=" + front + ", leave alone");
                      } else {
                          log("no window, pulling aerial (attempt " + attempts + ")");
                          pull();
                      }
                      handler.postDelayed(this, CHECK_MS);
                  }
              };

              private String frontPackage() {
                  try {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root == null) {
                          return null;
                      }
                      String pkg = root.getPackageName() == null ? null : root.getPackageName().toString();
                      try {
                          root.recycle();
                      } catch (Throwable ignored) {
                      }
                      return pkg;
                  } catch (Throwable t) {
                      log("frontPackage failed: " + t);
                      return null;
                  }
              }

              private void pull() {
                  try {
                      Intent i = new Intent();
                      i.setComponent(new ComponentName(AERIAL_PKG, AERIAL_CLS));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                      startActivity(i);
                  } catch (Throwable t) {
                      log("startActivity failed: " + t);
                  }
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
              }

              private void log(String msg) {
                  logLine(this, msg);
              }

              static void logLine(Context context, String msg) {
                  try {
                      Context de = context.createDeviceProtectedStorageContext();
                      File dir = de.getFilesDir();
                      if (dir == null) {
                          return;
                      }
                      dir.mkdirs();
                      String line = new SimpleDateFormat("HH:mm:ss.SSS", Locale.US)
                              .format(new Date()) + " " + msg + "\n";
                      FileOutputStream out = new FileOutputStream(new File(dir, "rescue.log"), true);
                      try {
                          out.write(line.getBytes("UTF-8"));
                      } finally {
                          out.close();
                      }
                  } catch (Throwable ignored) {
                  }
              }
          }
          JAVA

          cat > app/src/main/java/com/sln162/bootrescue/BootGuardReceiver.java <<'RCV'
          package com.sln162.bootrescue;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootGuardReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  BootA11yService.logLine(context, "boot receiver: " + intent.getAction());
                  BootA11yService.ensureSelf(context, false);
              }
          }
          RCV

          cat > app/src/main/java/com/sln162/bootrescue/MainActivity.java <<'ACT'
          package com.sln162.bootrescue;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  String enabled = Settings.Secure.getString(getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  boolean on = enabled != null && enabled.contains(getPackageName());

                  LinearLayout ll = new LinearLayout(this);
                  ll.setOrientation(LinearLayout.VERTICAL);
                  ll.setGravity(Gravity.CENTER);
                  ll.setBackgroundColor(Color.BLACK);
                  ll.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));

                  TextView t = new TextView(this);
                  t.setText("BootRescue 2.1\n\n"
                          + "无障碍服务：" + (on ? "已启用" : "未启用") + "\n"
                          + "uptime: " + (SystemClock.elapsedRealtime() / 1000) + " s\n"
                          + "target: app.orchard.tv\n\n"
                          + "开机绑定后会补写自己回无障碍列表");
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(20);
                  t.setGravity(Gravity.CENTER);
                  ll.addView(t);

                  setContentView(ll);
              }
          }
          ACT

          echo "--- result ---"
          ls -l app/src/main/java/com/sln162/bootrescue/ app/src/main/res/xml/
          cat app/src/main/AndroidManifest.xml | head -30

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install platform and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk BootRescue-${{ inputs.version }}.apk
          ls -l

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BootRescue-${{ inputs.version }}
          path: app/build/outputs/apk/debug/BootRescue-*.apk

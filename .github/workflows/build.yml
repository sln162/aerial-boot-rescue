name: build-apk

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: 'v1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reset project sources
        run: |
          rm -rf app/src/main/java app/src/main/res
          mkdir -p app/src/main/java/com/sln162/bootrescue

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sln162.bootrescue'
              compileSdk 28

              defaultConfig {
                  applicationId "com.sln162.bootrescue"
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="false"
                  android:label="BootRescue">

                  <receiver
                      android:name=".BootRescueReceiver"
                      android:directBootAware="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:excludeFromRecents="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/com/sln162/bootrescue/BootRescueReceiver.java <<'JAVA'
          package com.sln162.bootrescue;

          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.os.SystemClock;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class BootRescueReceiver extends BroadcastReceiver {
              private static final String AERIAL_PKG = "app.orchard.tv";
              private static final String AERIAL_CLS = "app.orchard.tv.MainActivity";
              private static final long BOOT_WINDOW_MS = 120000L;
              private static final long SETTLE_MS = 1800L;
              private static volatile boolean sDone = false;

              @Override
              public void onReceive(Context context, Intent intent) {
                  String action = intent == null ? null : intent.getAction();
                  long up = SystemClock.elapsedRealtime();
                  log(context, "onReceive " + action + " uptime=" + up);
                  if (sDone) {
                      log(context, "skip: already handled in this process");
                      return;
                  }
                  if (up > BOOT_WINDOW_MS) {
                      log(context, "skip: outside boot window");
                      return;
                  }
                  sDone = true;
                  Context app = context.getApplicationContext();
                  final Context ctx = app != null ? app : context;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Thread.sleep(SETTLE_MS);
                          } catch (InterruptedException ignored) {
                          }
                          launch(ctx);
                      }
                  }, "rescue").start();
              }

              private void launch(Context ctx) {
                  try {
                      Intent i = ctx.getPackageManager().getLaunchIntentForPackage(AERIAL_PKG);
                      if (i == null) {
                          log(ctx, "no launch intent, falling back to explicit component");
                          i = new Intent();
                          i.setComponent(new ComponentName(AERIAL_PKG, AERIAL_CLS));
                      }
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                              | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                      ctx.startActivity(i);
                      log(ctx, "startActivity ok: " + i);
                  } catch (Throwable t) {
                      log(ctx, "startActivity failed: " + t);
                  }
              }

              private void log(Context ctx, String msg) {
                  try {
                      Context de = ctx.createDeviceProtectedStorageContext();
                      File dir = de.getFilesDir();
                      if (dir == null) {
                          return;
                      }
                      dir.mkdirs();
                      String line = new SimpleDateFormat("HH:mm:ss.SSS", Locale.US)
                              .format(new Date()) + " " + msg + "\n";
                      FileOutputStream out = new FileOutputStream(new File(dir, "rescue.log"), true);
                      try {
                          out.write(line.getBytes("UTF-8"));
                      } finally {
                          out.close();
                      }
                  } catch (Throwable ignored) {
                  }
              }
          }
          JAVA

          cat > app/src/main/java/com/sln162/bootrescue/MainActivity.java <<'ACT'
          package com.sln162.bootrescue;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout ll = new LinearLayout(this);
                  ll.setOrientation(LinearLayout.VERTICAL);
                  ll.setGravity(Gravity.CENTER);
                  ll.setBackgroundColor(Color.BLACK);
                  ll.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));

                  TextView t = new TextView(this);
                  t.setText("BootRescue\n\n"
                          + "uptime: " + (SystemClock.elapsedRealtime() / 1000) + " s\n"
                          + "target: app.orchard.tv\n\n"
                          + "开机 2 分钟内自动拉起 Aerial");
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(20);
                  t.setGravity(Gravity.CENTER);
                  ll.addView(t);

                  setContentView(ll);
              }
          }
          ACT

          echo "--- result ---"
          ls -l app/src/main/java/com/sln162/bootrescue/
          cat app/src/main/AndroidManifest.xml | head -30

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install platform and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk BootRescue-${{ inputs.version }}.apk
          ls -l

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BootRescue-${{ inputs.version }}
          path: app/build/outputs/apk/debug/BootRescue-*.apk

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sln162.bootrescue'
    compileSdk 28

    defaultConfig {
        applicationId "com.sln162.bootrescue"
        minSdk 23
        targetSdk 28
        versionCode 56
        versionName "1.9.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

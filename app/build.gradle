plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jmk92.resolverkiller'
    compileSdk 28

    defaultConfig {
        applicationId "com.jmk92.resolverkiller"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
